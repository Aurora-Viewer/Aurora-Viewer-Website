# Keeps latest.json (the newest viewer release) up to date, so the pages read it from this
# site rather than from the visitor's own GitHub API calls, which can be rate limited or blocked.
name: Latest release

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Write latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/latest_release.py latest.json

      - name: Commit it when it changed
        run: |
          if [ -z "$(git status --porcelain -- latest.json)" ]; then
            echo "latest.json is up to date"
            exit 0
          fi
          version=$(python3 -c "import json; print(json.load(open('latest.json'))['version'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "latest.json: v$version"
          git push
